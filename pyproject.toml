[build-system]
requires = ["setuptools==84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mfx-forex-core"
version = "0.1.0"
requires-python = ">=3.11"
description = "MFX cloud-only synthetic Forex 1.0 parity contracts; analysis only, no live trading"
readme = "README.md"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
