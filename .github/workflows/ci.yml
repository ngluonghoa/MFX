name: MFX 1:1 parity CI and artifact smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  python-unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Explicit immutable commits verified against official actions/* refs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # full local refs for historical scanner
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned A03 CI-only coverage and shrinkable fuzz tools
        run: python -m pip install coverage==7.10.7 hypothesis==6.142.4
      - name: Bytecode compile
        run: python -m compileall -q src tests mfx_research tools/run_a04_p16_signal_demo.py tools/run_a04_p19_causal_context_demo.py tools/run_a04_p20_confirmed_swing_demo.py tools/run_a04_p21_policy_review_demo.py tools/run_a04_p22_casebook_demo.py tools/run_a04_p23_sensitivity_demo.py tools/run_a04_p24_structure_event_demo.py tools/run_a04_p25_mock_cloud_journal_demo.py
      - name: Synthetic unit and negative tests with real source branch coverage (A03)
        env:
          PYTHONPATH: src
        run: |
          python -m coverage run --branch --source=src/forex_trading -m unittest discover -s tests -v
          python -m coverage json -o .ci-a03-coverage.json
      - name: Validate 30-source-module measured line/branch coverage report (A03)
        run: python tools/check_a03_coverage.py
      - name: A03/P0.5 report actual remaining branch arcs in five weak modules
        run: python tools/report_a03_p05_gaps.py
      - name: A03/P0.5b deterministic synthetic arc-feedback mutation campaign
        env:
          PYTHONPATH: src
        run: python tools/run_a03_coverage_feedback.py
      - name: Require reproducible A03 property/fuzz suite inventory (synthetic only)
        env:
          PYTHONPATH: src
        run: python tools/check_a03_property_suite.py
      - name: A03/P0.3 verify systematic stateful fuzz corpus and replay budget
        env:
          PYTHONPATH: src
        run: python tools/check_a03_stateful_fuzz_budget.py
      - name: A03/P0.2 targeted mutation adequacy on ephemeral source copy (17 sentinel mutants)
        run: python tools/run_a03_mutation_sentinels.py
      - name: Verify immutable Forex source manifest and approved MFX-only deltas (A01)
        run: python tools/verify_frozen_source_baseline.py
      - name: Checkout exact frozen Forex 1.0 source (A01 golden reference)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ngluonghoa/forex-trading-1-0
          ref: 7e1c1c012b1b189be5ad7b9d07756eac012a8309
          path: .ci-frozen-forex
          fetch-depth: 1
          persist-credentials: false
      - name: Compare fixed synthetic golden outputs and reasons against frozen Forex (A01)
        run: |
          test "$(git -C .ci-frozen-forex rev-parse HEAD)" = "7e1c1c012b1b189be5ad7b9d07756eac012a8309"
          test "$(git -C .ci-frozen-forex rev-parse 'HEAD^{tree}')" = "5df2058346f6dc96ed5bb02581b139fe2aa2d803"
          PYTHONPATH="$PWD/.ci-frozen-forex/src" python tools/render_golden_contract.py --source-root .ci-frozen-forex/src --output .ci-golden/reference.json
          PYTHONPATH="$PWD/src" python tools/render_golden_contract.py --source-root src --output .ci-golden/mfx.json
          python tools/compare_golden_contracts.py --reference .ci-golden/reference.json --candidate .ci-golden/mfx.json
      - name: A04/P0.7 REQUIRE pinned frozen Forex vs MFX 34-case pure wrapper parity
        run: |
          PYTHONPATH="$PWD/.ci-frozen-forex/src:$PWD" python -m tools.render_a04_p07_wrapper_golden --source-root .ci-frozen-forex/src --output .ci-golden/a04-p07-frozen.json
          PYTHONPATH="$PWD/src:$PWD" python -m tools.render_a04_p07_wrapper_golden --source-root src --output .ci-golden/a04-p07-mfx.json
          PYTHONPATH="$PWD/src:$PWD" python -m tools.compare_a04_p07_wrapper_golden --reference .ci-golden/a04-p07-frozen.json --candidate .ci-golden/a04-p07-mfx.json
      - name: A04/P0.2 exact frozen-source adapter declaration golden bridge (50 synthetic scenarios)
        env:
          PYTHONPATH: src:.
        run: python tools/check_a04_adapter_golden.py --reference .ci-golden/reference.json --candidate .ci-golden/mfx.json
      - name: A04/P0.3 fail-closed synthetic ABI/schema transition and declaration-only rollback matrix
        env:
          PYTHONPATH: src:.
        run: python tools/check_a04_schema_matrix.py
      - name: A04/P0.4 REQUIRE pinned GitHub-only real disposable revert and inert canary matrix
        env:
          PYTHONPATH: src:.
        run: python tools/run_a04_canary_git_drill.py
      - name: A04/P0.5 REQUIRE pinned protected-main review / exact schema NO-RUNTIME gate
        env:
          PYTHONPATH: src:.
        run: python tools/check_a04_p05_recovery_gate.py
      - name: A04/P0.6 REQUIRE pinned real 30-module AST/signature/import guard
        env:
          PYTHONPATH: src:.
        run: python tools/check_a04_p06_runtime_seams.py
      - name: A04/P0.8 REQUIRE pinned 28-case source seam authorization STOP gate
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p08_seams
      - name: A04/P0.9 REQUIRE pinned seven real callable signature / future schema gap matrix
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p09_callable_gaps
      - name: A04/P0.10 REQUIRE pinned DESIGN-ONLY mapper prerequisites and deny all runtime/rights claims
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p10_mapper_matrix
      - name: A04/P0.11 REQUIRE pinned actual field-level lineage no-runtime authority
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p11_field_lineage
      - name: A04/P0.12 REQUIRE pinned 32-case synthetic quote clock rights fail-closed gate
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p12_synthetic_qualification
      - name: A04/P0.13 REQUIRE pinned rights and capabilities attestation negative gate
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p13_evidence_intake
      - name: A04/P0.14 REQUIRE official public vendor evidence review stop gate
        env:
          PYTHONPATH: src:.
        run: python -m tools.check_a04_p14_public_evidence
      - name: A04/P0.16 REQUIRE actual offline synthetic BUY/SELL research-only receipts
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p16_signal_demo
      - name: A04/P0.17 REQUIRE exact original 18-label classification and unverified safety
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p17_zone_catalog_demo
      - name: A04/P0.18 REQUIRE actual synthetic B2/S2 numeric research-only cases
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p18_pullback_demo
      - name: A04/P0.19 REQUIRE causally derived multitimeframe research BUY/SELL receipts
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p19_causal_context_demo
      - name: A04/P0.20 REQUIRE confirmed right-bar swing structure research receipt
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p20_confirmed_swing_demo
      - name: A04/P0.21 REQUIRE B2/S2 source parameter registry never authorizes unapproved signals
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p21_policy_review_demo
      - name: A04/P0.22 REQUIRE source-aware B2/S2 proposal and 14 causal fail-closed cases
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p22_casebook_demo
      - name: A04/P0.23 REQUIRE independent B2/S2 synthetic causal and numeric-boundary oracle
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p23_sensitivity_demo
      - name: A04/P0.24 REQUIRE SIM causal structure and immutable event replay oracle
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p24_structure_event_demo
      - name: A04/P0.25 REQUIRE SIM mock Cloud CAS/concurrency/restart and rights gates
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p25_mock_cloud_journal_demo
      - name: A04/P0.26 REQUIRE Docs required-revision CAS/Drive NO-GO read-only contracts
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p26_docs_contract_demo
      - name: A04/P0.27 REQUIRE 18-zone original BUY/SELL source evidence and approval isolation
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p27_source_evidence_demo
      - name: A04/P0.28E REQUIRE MFX-only FX-B9 8BUY/8SELL design-overlay and B3 overlap guard
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p28e_fxb9_design_demo
      - name: A04/P0.30 REQUIRE approved 22-zone MFX design-only 8BUY+8SELL+2WATCH+4EXIT and NO_SIGNAL
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p30_22zone_design_demo
      - name: A04/P0.31 REQUIRE 22-zone SIM-only role grouping and NO_SIGNAL safety
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p31_sim_22_zone_demo
      - name: A04/P0.32 REQUIRE computed SIM CLOSED-OHLC B2/S2 -> 22-zone NO_SIGNAL research receipts
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p32_sim_ohlc_bridge_demo
      - name: A04/P0.33 REQUIRE causal prefix-stable SIM OHLC replay chain and NO_SIGNAL
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p33_replay_demo
      - name: A04/P0.34 REQUIRE 16-case causal SIM replay stress and pinned 36-owner numeric decision dossier
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p34_stress_owner_dossier_demo
      - name: A04/P0.35 REQUIRE 36-row external-owner proposal intake deny forged numeric approval
        env:
          PYTHONPATH: src:.
        run: python -m tools.run_a04_p35_owner_intake_demo
      - name: A04/P0.42 REQUIRE all 11 SIM mirror pairs metamorphic NO_SIGNAL safety
        env:
          PYTHONPATH: src:.
        run: python -m unittest discover -s tests -p test_a04_p42_mirror_metamorphic.py -v
      - name: A04/P0.43 REQUIRE source-pinned 14 remaining entry/56 phase review NO_SIGNAL
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -p test_a04_p43_remaining_entry_source_gaps.py -v
          python -m tools.run_a04_p43_remaining_entry_gap_demo
      - name: A04/P0.44 REQUIRE genuinely computed CLOSED SIM B3/S4 H1 range NO_SIGNAL research
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -p test_a04_p44_sim_range_rejection.py -v
          python -m tools.run_a04_p44_sim_range_demo
      - name: A04/P0.45 REQUIRE UTC CLOSED M5 incremental cache codec and no-price CI demo
        env:
          PYTHONPATH: src:.
        run: |
          python -m unittest discover -s tests -p test_a04_p45_td_cache_codec.py -v
          python -m tools.run_a04_p45_offline_cache_demo
          python -m compileall -q tools/run_a04_p45_cloud_twelve_data_cache.py
      - name: Install pinned Ruff and mypy static analyzers
        run: python -m pip install ruff==0.13.0 mypy==1.18.2
      - name: Reject critical Python syntax and undefined-name issues
        run: ruff check --select E9,F63,F7,F82 src tests tools mfx_research
      - name: Reject broad syntax and indentation issues
        run: ruff check --select E4,E7 src tests tools mfx_research
      - name: Full Pyflakes 30-module check with exact frozen legacy F401 baseline (A02)
        run: python tools/check_a02_pyflakes_baseline.py
      - name: Strict mypy full 30-module diagnostic audit (A02/P0.2)
        run: |
          python -m mypy --strict --python-version 3.11 --show-error-codes --no-incremental src/forex_trading
      - name: A04/P0.1 strict mypy for inert typed plugin declarations (Cloud-only)
        env:
          PYTHONPATH: src
          MYPYPATH: src
        run: python -m mypy --strict --python-version 3.11 --show-error-codes --no-incremental tools/a04_plugin_contracts.py tools/a04_adapter_conformance.py tools/a04_contract_migration.py tools/check_a04_schema_matrix.py tools/a04_canary_contract.py tools/run_a04_canary_git_drill.py tools/a04_p05_recovery_selection.py tools/check_a04_p05_recovery_gate.py tools/a04_p06_runtime_seams.py tools/check_a04_p06_runtime_seams.py tools/a04_p07_readonly_wrappers.py tools/render_a04_p07_wrapper_golden.py tools/compare_a04_p07_wrapper_golden.py tools/a04_p08_seam_review.py tools/check_a04_p08_seams.py tools/a04_p09_callable_port_gaps.py tools/check_a04_p09_callable_gaps.py tools/a04_p10_mapper_matrix.py tools/check_a04_p10_mapper_matrix.py tools/a04_p11_field_lineage.py tools/check_a04_p11_field_lineage.py tools/a04_p12_synthetic_qualification.py tools/check_a04_p12_synthetic_qualification.py tools/a04_p13_evidence_intake.py tools/check_a04_p13_evidence_intake.py tools/a04_p14_public_vendor_evidence.py tools/check_a04_p14_public_evidence.py mfx_research/offline_ema_signals.py tools/run_a04_p16_signal_demo.py mfx_research/zone_catalog_gate.py tools/run_a04_p17_zone_catalog_demo.py mfx_research/pullback_pilot.py tools/run_a04_p18_pullback_demo.py mfx_research/causal_multitf_context.py tools/run_a04_p19_causal_context_demo.py mfx_research/confirmed_swings.py tools/run_a04_p20_confirmed_swing_demo.py mfx_research/source_parameter_review.py tools/run_a04_p21_policy_review_demo.py mfx_research/p022_policy_casebook.py tools/run_a04_p22_casebook_demo.py tools/run_a04_p23_sensitivity_demo.py tools/run_a04_p24_structure_event_demo.py tools/run_a04_p25_mock_cloud_journal_demo.py mfx_research/p024_structure_event_gate.py mfx_research/p025_mock_cloud_journal.py mfx_research/p026_docs_cas_readiness.py tools/run_a04_p26_docs_contract_demo.py mfx_research/p027_signal_source_audit.py tools/run_a04_p27_source_evidence_demo.py mfx_research/p028e_fxb9_design_overlay.py tools/run_a04_p28e_fxb9_design_demo.py mfx_research/p030_approved_nonentry_design.py tools/run_a04_p30_22zone_design_demo.py mfx_research/p031_sim_22_zone_router.py tools/run_a04_p31_sim_22_zone_demo.py mfx_research/p032_synthetic_ohlc_bridge.py tools/run_a04_p32_sim_ohlc_bridge_demo.py mfx_research/p033_asof_sim_replay.py tools/run_a04_p33_replay_demo.py mfx_research/p034_sim_adversarial_review.py tools/run_a04_p34_stress_owner_dossier_demo.py mfx_research/p035_owner_proposal_intake.py tools/run_a04_p35_owner_intake_demo.py mfx_research/p043_remaining_entry_source_gaps.py tools/run_a04_p43_remaining_entry_gap_demo.py mfx_research/p044_sim_range_rejection.py tools/run_a04_p44_sim_range_demo.py mfx_cache/td_m5_codec.py tools/run_a04_p45_offline_cache_demo.py
      - name: Install pinned RE4c security audit tools (CI only)
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Scan tracked repository text for high-confidence credential signatures
        run: python tools/check_repo_secrets.py
      - name: Block high-confidence credentials in reachable Git history
        run: python -m tools.check_git_history_secrets
      - name: Audit Python source and tooling for medium/high security findings
        run: bandit -r src tools --severity-level medium --confidence-level medium
      - name: Check declared project dependencies against live vulnerability advisories
        run: pip-audit --progress-spinner off .
      - name: Audit resolved PEP 517 build requirement range (not an exact build lock)
        run: |
          python tools/write_build_audit_requirements.py .ci-build-requirements.txt
          pip-audit --progress-spinner off --requirement .ci-build-requirements.txt
      - name: Validate current CI Python environment
        run: python -m pip check
      - name: Build wheel twice with a fixed source timestamp (NOT a release)
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir .ci-wheel .
          python -m pip wheel --no-cache-dir --no-deps --wheel-dir .ci-wheel-repeat .
      - name: Verify source metadata and same-environment wheel hash parity
        run: python tools/verify_build_artifact.py .ci-wheel --repeat-wheel-dir .ci-wheel-repeat
      - name: Assert isolated Cloud MFX wheel import ownership (NO deployment)
        run: |
          python -m venv .ci-mfx-venv
          .ci-mfx-venv/bin/python -m pip install --no-index --no-deps .ci-wheel/*.whl
          .ci-mfx-venv/bin/python tools/check_mfx_import_ownership.py
      - name: Upload one verified CI wheel for RE5a cross-Python comparison (NOT release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 pinned
        with:
          name: mfx-baseline-wheel-${{ matrix.python-version }}
          path: .ci-wheel/*.whl
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  cross-python-wheel-parity:
    name: Cross-Python wheel parity (3.11 / 3.12)
    needs: python-unittest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download Python 3.11 wheel from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 pinned
        with:
          name: mfx-baseline-wheel-3.11
          path: .ci-cross-python/py311
      - name: Download Python 3.12 wheel from this workflow run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0 pinned
        with:
          name: mfx-baseline-wheel-3.12
          path: .ci-cross-python/py312
      - name: Verify two Python builds are byte-identical and match exact checked-out source
        run: python -m tools.check_cross_python_artifacts .ci-cross-python/py311 .ci-cross-python/py312

  postmain-status:
    name: Publish independently readable main-push CI status (NO release)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'ngluonghoa/MFX' }}
    needs: [python-unittest, cross-python-wheel-parity]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - name: Publish exact-GITHUB_SHA native commit status after Python 3.11 / 3.12 / wheel PASS
        env:
          MFX_STATUS_TOKEN: ${{ github.token }}
        run: python -m tools.postmain_ci_commit_status

  p037-read-main-push:
    name: P0.37 read-only diagnosis of latest main-push CI run
    if: ${{ github.event_name == 'pull_request' && github.repository == 'ngluonghoa/MFX' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 pinned
        with:
          persist-credentials: false
      - name: Read main SHA actual push-run jobs and native statuses (NO release)
        env:
          P037_READ_TOKEN: ${{ github.token }}
        run: python -m tools.read_main_push_ci_diagnostic
