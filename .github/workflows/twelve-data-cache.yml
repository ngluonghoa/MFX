name: MFX V2 Staged Hourly Twelve Data → Private Drive Batch (NO trading)

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfx-twelvedata-private-cache
  cancel-in-progress: false

jobs:
  cache:
    if: ${{ vars.MFX_REAL_CACHE_ENABLED == 'true' && vars.MFX_V2_BATCH_CACHE_ACCEPTED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout MFX repo (read only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install exact scoped cloud client requirements
        run: python -m pip install --disable-pip-version-check google-auth==2.43.0 requests==2.32.5
      - name: Sync verified CLOSED EUR/USD M5 MID as one V2 hourly batch
        env:
          PYTHONPATH: src:.
          MFX_REAL_CACHE_ENABLED: "true"
          MFX_V2_BATCH_CACHE_ACCEPTED: "true"
          MFX_TWELVE_DATA_API_KEY: ${{ secrets.MFX_TWELVE_DATA_API_KEY }}
          MFX_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.MFX_GDRIVE_SERVICE_ACCOUNT_JSON }}
          MFX_TD_DAILY_CREDIT_CAP: ${{ vars.MFX_TD_DAILY_CREDIT_CAP || '400' }}
        run: python -m tools.run_a04_p46_cloud_batch_cache
