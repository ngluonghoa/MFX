name: MFX B3B manual indexed B1 sealed source reconciliation (STAGED)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mfx-twelvedata-private-cache
  cancel-in-progress: false

jobs:
  sealed-index:
    if: ${{ vars.MFX_REAL_CACHE_ENABLED == 'true' && vars.MFX_V2_BATCH_CACHE_ACCEPTED == 'true' && vars.MFX_B3B_SEALED_INDEX_ACCEPTED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout MFX source (read only)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install scoped Cloud service-account dependencies
        run: python -m pip install --disable-pip-version-check google-auth==2.43.0 requests==2.32.5
      - name: Check source B1 immutable SHA chain and reconcile ONE indexed pointer
        env:
          PYTHONPATH: src:.
          MFX_REAL_CACHE_ENABLED: 'true'
          MFX_V2_BATCH_CACHE_ACCEPTED: 'true'
          MFX_B3B_SEALED_INDEX_ACCEPTED: 'true'
          MFX_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.MFX_GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: python -m tools.run_a04_p46_b3b_index_cloud
